<body>

<div class="music-container">

    <h1>THE GOATED PLAYLIST</h1>

    <p>Only the best gym music makes this list. Check out what other gym members are voting for!</p>

    <h2>Choose Your Gym</h2>

    <select id="gym" onchange="showSongs()">
        <option value="MSU Gym">MSU Gym</option>
        <option value="Planet Fitness">Planet Fitness</option>
        <option value="Anytime Fitness">Anytime Fitness</option>
        <option value="Other">Other</option>
    </select>

    <h2>Top Gym Songs</h2>

    <div id="songList"></div>

</div>

<script>
    function showSongs() {
        let gym = document.getElementById("gym").value;

        let songs = JSON.parse(localStorage.getItem("gymSongs")) || [];

        let filtered = songs.filter(song => song.gym === gym);

        filtered.sort((a, b) => b.votes - a.votes);

        let list = document.getElementById("songList");
        list.innerHTML = "";

        if (filtered.length === 0) {
            list.textContent = "No songs have been submitted for this gym yet. Visit Okay Sounds to add some!";
            return;
        }

        filtered.forEach((song, index) => {
            let div = document.createElement("div");
            div.className = "song";

            let heading = document.createElement("h3");
            heading.textContent = (index + 1) + ". " + song.name + " - " + song.artist;

            let details = document.createElement("p");
            details.textContent = "Genre: " + song.genre;

            let votes = document.createElement("p");
            votes.textContent = "👍 " + song.votes + " votes";

            div.appendChild(heading);
            div.appendChild(details);
            div.appendChild(votes);

            list.appendChild(div);
        });
    }

    showSongs();
</script>

</body>
</html>
