<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Created</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    
        body {
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-bottom: 20px;
        }

        .homepage h2 {
            margin-bottom: 16px;
            color: #28a745; 
        }

        .homepage p {
            color: #666666;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .homepage a {
            display: inline-block;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .homepage a:hover {
            text-decoration: underline;
        }

        footer {
            color: #888888;
            font-size: 12px;
            text-align: center;
            position: absolute;
            bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="box-container">
        <div class="homepage">
            <h2>Account Created</h2>
            <p>Thank you for signing up! Click the link below to return to the home page.</p>
